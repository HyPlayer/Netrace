[project]
name = "netrace"
version = "0.1.0"
description = "Network tracing TUI for encrypted /xeapi and /eapi traffic"
requires-python = ">=3.11"
dependencies = [
  "cryptography",
  "requests",
  "textual",
  "mitmproxy",
]

[project.scripts]
netrace = "tool.aegis_tui:main"
netrace-selftest = "tool.aegis_mitm_selftest:main"
aegis-mitm-tui = "tool.aegis_tui:main"
aegis-mitm-selftest = "tool.aegis_mitm_selftest:main"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["tool"]
py-modules = ["aegis_xeapi", "mitm_aegis_xeapi"]

[dependency-groups]
dev = []
